<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Engineering Details</title>
<meta name="description" content="How the RL pipeline behind Muse Glimmer + RL works: streaming GRPO, prefix-shared packing, a Triton attention kernel, and serving LoRA adapters with speculative decoding.">
<link rel="stylesheet" href="style.css?v=3">
</head>
<body>
<header class="top">
  <div class="wrap">
    <a class="brand" href="./">Muse Glimmer + RL</a>
    <nav>
      <a href="./">Project page</a>
      <a href="engineering.html" aria-current="page">Engineering details</a>
      <a href="https://github.com/georgesung/muse-habitat">GitHub</a>
      <a href="https://huggingface.co/georgesung/Muse-Glimmer-30B-Habitat-PARTNR-Lora">LoRA adapter</a>
    </nav>
  </div>
</header>

<main class="wrap doc-layout">
  <aside class="toc" aria-label="Contents">
    <details id="toc-box" open>
      <summary>Contents</summary>
      <ol id="toc"></ol>
    </details>
  </aside>
  <article class="doc" id="doc">
    <p class="note">Loading&hellip; If this page stays empty, read
      <a href="https://github.com/georgesung/muse-habitat/blob/main/docs/engineering.md">docs/engineering.md on GitHub</a>.</p>
  </article>
</main>

<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script>
(async function () {
  const doc = document.getElementById("doc");
  const toc = document.getElementById("toc");
  // Same anchors as GitHub's rendering of the markdown, so links work in both places.
  const slug = (t) => t.trim().toLowerCase().replace(/[^\p{L}\p{N}\s-]/gu, "").replace(/\s/g, "-");
  let md;
  try {
    const r = await fetch("engineering.md", { cache: "no-cache" });
    if (!r.ok) throw new Error(r.status);
    md = await r.text();
    if (!window.marked) throw new Error("markdown renderer did not load");
  } catch (e) {
    return; // the fallback link stays
  }
  doc.innerHTML = marked.parse(md);
  const used = {};
  for (const h of doc.querySelectorAll("h1, h2, h3")) {
    let id = slug(h.textContent);
    if (used[id] !== undefined) id = `${id}-${++used[id]}`; else used[id] = 0;
    h.id = id;
    if (h.tagName === "H1") continue;
    const li = document.createElement("li");
    li.className = h.tagName === "H3" ? "sub" : "";
    const a = document.createElement("a");
    a.href = "#" + id;
    a.textContent = h.textContent;
    li.appendChild(a);
    toc.appendChild(li);
  }
  for (const t of doc.querySelectorAll("table")) {
    const box = document.createElement("div");
    box.className = "table-scroll";
    t.replaceWith(box);
    box.appendChild(t);
  }
  for (const a of doc.querySelectorAll('a[href^="http"]')) a.rel = "noopener";
  if (window.matchMedia("(max-width: 900px)").matches) document.getElementById("toc-box").open = false;
  if (location.hash) {
    const el = document.getElementById(decodeURIComponent(location.hash.slice(1)));
    if (el) el.scrollIntoView();
  }
  // Highlight the section being read.
  const links = [...toc.querySelectorAll("a")];
  const heads = links.map((a) => document.getElementById(a.getAttribute("href").slice(1)));
  const onScroll = () => {
    let cur = 0;
    heads.forEach((h, i) => { if (h.getBoundingClientRect().top < 120) cur = i; });
    links.forEach((a, i) => a.classList.toggle("active", i === cur));
  };
  document.addEventListener("scroll", onScroll, { passive: true });
  onScroll();
})();
</script>
</body>
</html>
