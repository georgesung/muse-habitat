[project]
name = "muse-habitat"
version = "0.1.0"
description = "Muse Glimmer 30B on Habitat / PARTNR: planner backends, baselines, and RL training to improve it"
readme = "README.md"
authors = [
    { name = "George Sung", email = "georgesung@gmail.com" }
]
# The backends run inside PARTNR's own env (../envs/partnr, Python 3.9, habitat_llm), on PYTHONPATH
requires-python = ">=3.9"
dependencies = []

[build-system]
requires = ["uv_build>=0.10.9,<0.11.0"]
build-backend = "uv_build"
