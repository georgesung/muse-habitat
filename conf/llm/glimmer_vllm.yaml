# Muse Glimmer 30B served by vLLM (scripts/glimmer_serve.sh), raw completions with Glimmer's chat tags.
# Assistant turns go to the user channel ("to=user"), so the hidden reasoning channel is skipped and the ReAct
# "Thought:" line is the only reasoning, as for Llama.
llm:
  _target_    : muse_habitat.vllm_llm.VLLMCompletion
  _partial_   : True

host          : 127.0.0.1
port          : 8011
timeout       : 600
inference_mode: vllm

system_tag    : "<|start|>system<|message|>"
system_suffix : "\n\nReasoning strength: low.\n\n# Valid recipients: \"self\", \"user\"."
user_tag      : "<|start|>user<|message|>"
assistant_tag : "<|start|>assistant to=user<|message|>"
eot_tag       : "<|eot|>"

generation_params:
  engine        : glimmer
  max_tokens    : 250
  temperature   : 0.0
  stop          : "Assigned!"
  batch_response: False
